# Star Comms fleet configuration.
# Copy to config/fleet.yaml (gitignored) and fill in.
#
# One entry per Discord application. There is no API for creating applications,
# so each is registered by hand in the developer portal, and each needs the
# privileged SERVER MEMBERS intent toggled on.
#
# Tokens are never stored here — only the name of the env var holding them.
#
# v1 ships with one controller (slash commands, channel management, no voice)
# plus N relay bots that are allocated to voice channels as hails require.

controller:
  application_id: "000000000000000000"
  token_env: SB_TOKEN_CONTROLLER     # registers slash commands, creates + moves vessels

fleet:
  - nato: alfa
    application_id: "000000000000000000"
    token_env: SB_TOKEN_ALFA
  - nato: bravo
    application_id: "000000000000000000"
    token_env: SB_TOKEN_BRAVO
  - nato: charlie
    application_id: "000000000000000000"
    token_env: SB_TOKEN_CHARLIE

# Per-guild overridable defaults.
defaults:
  locale: en
  cue_set: default
  cue_duration_ms: 1200           # D_c — ready and attention normalise to this
  ring_interval_ms: 4000          # gap between repeated Ring plays in locked targets
  ring_max_ms: 20000              # ring budget before an unresponsive locked target auto-declines
  hail_silence_close_ms: 10000    # hail closes when no owner has spoken for this long
  hail_max_hold_ms: 1800000       # hard cap on a single hail (30 min safety net)

# Cue audio. Startup validates every asset against cue_duration_ms; ready
# and attention must match exactly (they play concurrently across channels),
# ring/busy/end have wider tolerance.
cue_sets:
  default:
    en:
      ready:     cues/en/ready.wav
      attention: cues/en/attention.wav
      busy:      cues/en/busy.wav
    da:
      ready:     cues/da/klar.wav
      attention: cues/da/giv_agt.wav
      busy:      cues/da/optaget.wav
    shared:
      ring:      cues/ring.wav
      end:       cues/end.wav
