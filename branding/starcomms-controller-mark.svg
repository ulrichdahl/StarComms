<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Star Comms controller mark: base-station beacon with three
       amber relay companions on a shared orbit. Same star vocabulary
       as StarBuddy; the trio makes the fleet legible at a glance.
       Guide star is compressed vertically so its bottom tip clears
       the bottom companion. -->
  <defs>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BE4F0"/>
      <stop offset="1" stop-color="#3FB2C8"/>
    </linearGradient>
    <linearGradient id="buddy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5D28A"/>
      <stop offset="1" stop-color="#D99A3A"/>
    </linearGradient>
  </defs>
  <!-- orbit — faint full ring, brighter accent arc top-right -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#5BC8DB" stroke-opacity="0.28" stroke-width="6"/>
  <path d="M 178 42 A 100 100 0 0 1 228 128" fill="none" stroke="#5BC8DB" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
  <!-- cyan guide star — the base-station beacon -->
  <path d="M128 46 Q136 118 220 128 Q136 138 128 204 Q120 138 36 128 Q120 118 128 46 Z" fill="url(#star)"/>
  <!-- three amber relay companions on the orbit, 120° apart -->
  <path d="M215 62 Q217 76 231 78 Q217 80 215 94 Q213 80 199 78 Q213 76 215 62 Z" fill="url(#buddy)"/>
  <path d="M41 62 Q43 76 57 78 Q43 80 41 94 Q39 80 25 78 Q39 76 41 62 Z" fill="url(#buddy)"/>
  <path d="M128 212 Q130 226 142 228 Q130 230 128 244 Q126 230 114 228 Q126 226 128 212 Z" fill="url(#buddy)"/>
</svg>
