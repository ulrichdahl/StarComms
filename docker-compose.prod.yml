# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  bot:
    environment:
      NODE_ENV: production
      LOG_FORMAT: json
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
