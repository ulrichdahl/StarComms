# Coolify-managed deployment stack.
#
# In the Coolify UI:
#   1. New Resource → Application → Public Repository (or Private + connect GitHub).
#      Point it at github.com/<owner>/StarComms, branch main.
#   2. Application type: Docker Compose.
#      Compose file: docker-compose.coolify.yml   (NOT docker-compose.yml — that
#      one bind-mounts your local dev tree.)
#   3. Environment Variables:
#      SB_TOKEN_CONTROLLER   ← from the Discord Developer Portal
#      SB_TOKEN_ALFA
#      SB_TOKEN_BRAVO
#      SB_TOKEN_CHARLIE
#      Mark all four as "Is Build Variable? No" and "Is Literal? Yes"
#      (they hold secrets — nothing to interpolate).
#   4. Storages (Persistent Storage tab) — Coolify only manages storage
#      that is DECLARED in this file, so nothing is added through the UI:
#      • starcomms-data is a named volume, auto-created.
#      • ./config/fleet.yaml is a relative bind mount. Coolify turns it into
#        an editable file entry in the Storages tab — paste your fleet.yaml
#        there (see config/fleet.example.yaml for the shape), save, restart.
#      • starcomms-cues is a named volume, auto-created. Like /data it
#        inherits `node` ownership from the image on first mount, so the
#        container can write to it with no host-side chown. On every start
#        the container generates any cue file that is missing (espeak-ng)
#        and never overwrites one that exists — to replace a voice,
#        `docker cp` your WAV over it (see docs/coolify.md).
#   5. Deploy.
#
# The bot exposes nothing publicly — Discord voice is outbound UDP only,
# and /healthz on port 3000 is only used by the internal healthcheck.
# You do NOT need a Traefik / Caddy domain on this application.

services:
  bot:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_PATH: /data/starcomms.db
      CONFIG_PATH: /etc/starcomms/fleet.yaml
      STATUS_PORT: "3000"
      LOG_FORMAT: json
      # Fleet tokens — injected by Coolify's env manager.
      SB_TOKEN_CONTROLLER: ${SB_TOKEN_CONTROLLER}
      SB_TOKEN_ALFA:       ${SB_TOKEN_ALFA}
      SB_TOKEN_BRAVO:      ${SB_TOKEN_BRAVO}
      SB_TOKEN_CHARLIE:    ${SB_TOKEN_CHARLIE}
    volumes:
      - starcomms-data:/data
      # Relative bind mounts: Coolify materialises these under
      # /data/coolify/applications/<uuid>/ and exposes the file one as an
      # editable entry in Storages. Do not replace with named volumes — an
      # empty named volume at /etc/starcomms shadows any file mount.
      - ./config/fleet.yaml:/etc/starcomms/fleet.yaml:ro
      # Named volume, NOT a bind mount: Docker copies the image's node
      # ownership onto an empty named volume, whereas a bind mount shows
      # the host directory's (root) ownership and the entrypoint's cue
      # generation would need a manual chown.
      - starcomms-cues:/app/cues
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

volumes:
  starcomms-data:
  starcomms-cues:
