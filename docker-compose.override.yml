# Auto-loaded by `docker compose up`. Development only.
services:
  bot:
    build:
      target: dev
    restart: "no"
    volumes:
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./data:/data
      - ./config:/etc/starcomms:ro
      - ./cues:/app/cues:ro
    environment:
      NODE_ENV: development
