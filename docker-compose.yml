name: starcomms

services:
  bot:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      # Optional so `docker compose config` works before you create it.
      - path: .env
        required: false
    environment:
      DB_PATH: /data/starcomms.db
      CONFIG_PATH: /etc/starcomms/fleet.yaml
      STATUS_PORT: "3000"
      # Preserved for the step-1 receive spike diagnostics.
      SPIKE_PORT: "3000"
    volumes:
      # Persistence, host-mounted. Must be writable by uid 1000 (the node user).
      - ./data:/data
      # Whole directory, so a missing fleet.yaml does not break `up`.
      - ./config:/etc/starcomms:ro
      - ./cues:/app/cues:ro
    # No `ports:` — Discord voice is outbound UDP only and /healthz is internal.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
